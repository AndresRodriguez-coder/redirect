<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Redirect</title>

    <style>
        :root { --fondo: #f9fafb; --texto: #6b7280; --enlace: #2563eb; }

        @media (prefers-color-scheme: dark) {
            :root { --fondo: #0f172a; --texto: #94a3b8; --enlace: #60a5fa; }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--fondo);
            color: var(--texto);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 0 16px;
        }

        p { margin: 8px 0; }
        a { color: var(--enlace); font-weight: 600; font-size: 18px; }
    </style>
</head>
<body>
    <!-- Un enlace por aplicación (ruta relativa a su carpeta). -->
    <main>
        <p>Selecciona la aplicación a la que quieres entrar:</p>
        <p><a href="gastos/">Gastos Externos</a></p>
    </main>
</body>
</html>
